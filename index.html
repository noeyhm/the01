<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>너에게 보내는 따뜻한 편지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-light: #fdf3dc;
      --gold-accent: #e6c687;
      --warm-cream: #fffaf0;
      --card-bg: rgba(24, 18, 14, 0.46);
      --card-border: rgba(255, 232, 185, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Gowun Batang', 'Nanum Myeongjo', serif;
      background-color: #1a1410;
      color: var(--warm-cream);
      -webkit-font-smoothing: antialiased;
    }

    /* 전체 배경 이미지 & 켄 번스(은은한 확대) 효과 */
    .bg-wrapper {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-image {
      width: 100%;
      height: 100%;
      background-image: url('dog.jpg');
      background-size: cover;
      background-position: center 35%;
      filter: brightness(0.84) contrast(1.04) saturate(1.08);
      transform: scale(1.03);
      animation: slowZoom 24s ease-in-out infinite alternate;
    }

    @keyframes slowZoom {
      0% { transform: scale(1.02) translate(0, 0); }
      100% { transform: scale(1.09) translate(-1%, -1%); }
    }

    /* 따뜻한 앰버/골드 톤 비네팅 및 오버레이 */
    .warm-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(circle at 25% 15%, rgba(255, 224, 166, 0.28) 0%, transparent 55%),
        radial-gradient(circle at 50% 50%, rgba(28, 20, 14, 0.18) 0%, rgba(16, 11, 8, 0.68) 100%);
      pointer-events: none;
    }

    /* 빛줄기(Sunbeams) 애니메이션 레이어 */
    .sunbeams {
      position: fixed;
      top: -25%;
      left: -15%;
      width: 140%;
      height: 140%;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      mix-blend-mode: screen;
    }

    .beam {
      position: absolute;
      top: -10%;
      width: 22%;
      height: 150%;
      background: linear-gradient(
        180deg,
        rgba(255, 236, 190, 0.24) 0%,
        rgba(255, 220, 155, 0.08) 55%,
        rgba(255, 220, 155, 0) 100%
      );
      transform-origin: top center;
      filter: blur(18px);
      animation: beamSway 11s ease-in-out infinite alternate;
    }

    .beam:nth-child(1) {
      left: 12%;
      width: 18%;
      transform: rotate(-22deg);
      animation-duration: 12s;
    }

    .beam:nth-child(2) {
      left: 34%;
      width: 26%;
      transform: rotate(-16deg);
      animation-duration: 15s;
      animation-delay: -3s;
    }

    .beam:nth-child(3) {
      left: 58%;
      width: 16%;
      transform: rotate(-28deg);
      animation-duration: 10s;
      animation-delay: -5s;
    }

    @keyframes beamSway {
      0% {
        opacity: 0.45;
        transform: rotate(-24deg) translateX(-18px);
      }
      50% {
        opacity: 0.85;
      }
      100% {
        opacity: 0.5;
        transform: rotate(-16deg) translateX(22px);
      }
    }

    /* 은은하게 떠오르는 하트 & 금빛 입자 캔버스 */
    #particleCanvas {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    /* 상단 음악 컨트롤 버튼 */
    .music-control {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 233, 189, 0.45);
      background: rgba(26, 19, 14, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--gold-light);
      font-family: 'Gowun Batang', serif;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      transition: all 0.35s ease;
    }

    .music-control:hover {
      background: rgba(48, 35, 25, 0.72);
      border-color: var(--gold-accent);
      transform: translateY(-1px);
    }

    .music-control.playing {
      border-color: var(--gold-accent);
      box-shadow: 0 0 20px rgba(230, 198, 135, 0.35);
    }

    .equalizer {
      display: inline-flex;
      align-items: flex-end;
      gap: 2.5px;
      height: 14px;
      width: 14px;
    }

    .equalizer span {
      display: block;
      width: 2.5px;
      height: 4px;
      background-color: var(--gold-accent);
      border-radius: 2px;
      transition: height 0.2s ease;
    }

    .music-control.playing .equalizer span:nth-child(1) {
      animation: eqBar 0.9s ease-in-out infinite alternate;
    }
    .music-control.playing .equalizer span:nth-child(2) {
      animation: eqBar 0.65s ease-in-out infinite alternate 0.2s;
    }
    .music-control.playing .equalizer span:nth-child(3) {
      animation: eqBar 0.8s ease-in-out infinite alternate 0.4s;
    }

    @keyframes eqBar {
      0% { height: 4px; }
      100% { height: 14px; }
    }

    /* 메인 편지 컨테이너 */
    .stage {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 72px 20px 32px;
    }

    .letter-card {
      position: relative;
      width: 100%;
      max-width: 540px;
      max-height: 82vh;
      overflow-y: auto;
      padding: 44px 38px 40px;
      border-radius: 24px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(11px);
      -webkit-backdrop-filter: blur(11px);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.45),
        inset 0 0 32px rgba(255, 228, 178, 0.08);
      text-align: center;
      scrollbar-width: none;
    }

    .letter-card::-webkit-scrollbar {
      display: none;
    }

    /* 카드 내부 이중 금빛 테두리 장식 */
    .letter-card::before {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 16px;
      border: 1px solid rgba(230, 198, 135, 0.22);
      pointer-events: none;
    }

    .ornament {
      color: var(--gold-accent);
      font-size: 1.05rem;
      letter-spacing: 0.35em;
      margin-bottom: 14px;
      opacity: 0;
      transform: translateY(-22px);
      animation: dropDownFade 1.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: 0.2s;
    }

    .letter-title {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--gold-light);
      letter-spacing: 0.06em;
      margin-bottom: 24px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateY(-24px);
      animation: dropDownFade 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: 0.55s;
    }

    .divider {
      width: 64px;
      height: 1px;
      margin: 0 auto 26px;
      background: linear-gradient(90deg, transparent, var(--gold-accent), transparent);
      opacity: 0;
      transform: translateY(-16px);
      animation: dropDownFade 1.2s ease forwards;
      animation-delay: 0.85s;
    }

    /* 위에서 아래로 순차적으로 내려오며 나타나는 문장들 */
    .letter-line {
      font-size: 1.06rem;
      line-height: 2.05;
      color: rgba(255, 250, 240, 0.95);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
      margin-bottom: 14px;
      word-break: keep-all;
      opacity: 0;
      transform: translateY(-26px);
      animation: dropDownFade 1.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .letter-line.d1 { animation-delay: 1.15s; }
    .letter-line.d2 { animation-delay: 1.85s; }
    .letter-line.d3 { animation-delay: 2.55s; }
    .letter-line.d4 { animation-delay: 3.25s; }
    .letter-line.d5 { animation-delay: 3.95s; }

    .letter-closing {
      margin-top: 26px;
      font-size: 0.98rem;
      color: var(--gold-accent);
      letter-spacing: 0.08em;
      opacity: 0;
      transform: translateY(-20px);
      animation: dropDownFade 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: 4.7s;
    }

    .replay-btn {
      margin-top: 24px;
      background: transparent;
      border: none;
      color: rgba(253, 243, 220, 0.65);
      font-family: 'Gowun Batang', serif;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 4px;
      opacity: 0;
      animation: dropDownFade 1.2s ease forwards;
      animation-delay: 5.4s;
      transition: color 0.3s ease;
    }

    .replay-btn:hover {
      color: var(--gold-light);
    }

    @keyframes dropDownFade {
      0% {
        opacity: 0;
        transform: translateY(-26px);
        filter: blur(3px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    /* 모바일 반응형 스타일 */
    @media (max-width: 600px) {
      .music-control {
        top: 16px;
        right: 16px;
        padding: 8px 14px;
        font-size: 0.82rem;
      }

      .stage {
        padding: 64px 16px 24px;
      }

      .letter-card {
        padding: 34px 22px 30px;
        border-radius: 20px;
        max-height: 80vh;
      }

      .letter-title {
        font-size: 1.28rem;
        margin-bottom: 18px;
      }

      .divider {
        margin-bottom: 20px;
      }

      .letter-line {
        font-size: 0.95rem;
        line-height: 1.9;
        margin-bottom: 12px;
      }

      .letter-closing {
        margin-top: 20px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- 배경 강아지 사진 -->
  <div class="bg-wrapper">
    <div class="bg-image" role="img" aria-label="따뜻하게 바라보는 하얀 강아지 배경"></div>
  </div>

  <!-- 따뜻한 색감 오버레이 -->
  <div class="warm-overlay"></div>

  <!-- 은은한 빛줄기 효과 -->
  <div class="sunbeams" aria-hidden="true">
    <div class="beam"></div>
    <div class="beam"></div>
    <div class="beam"></div>
  </div>

  <!-- 떠오르는 하트 & 금빛 입자 -->
  <canvas id="particleCanvas" aria-hidden="true"></canvas>

  <!-- 음악 켜기/끄기 버튼 -->
  <button id="musicBtn" class="music-control" type="button" aria-pressed="false">
    <span class="equalizer" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </span>
    <span id="musicLabel">음악 켜기</span>
  </button>

  <!-- 메인 편지 카드 -->
  <main class="stage">
    <article class="letter-card" id="letterCard">
      <div class="ornament">✦ &nbsp; ✦ &nbsp; ✦</div>
      <h1 class="letter-title">네가 있어 참 다행이야</h1>
      <div class="divider"></div>

      <p class="letter-line d1">
        아무 말 없이 곁에 와 조용히 눈을 맞춰주던 순간,<br>
        그 작은 온기 하나로도 하루의 고단함이 스르르 녹아내려.
      </p>
      <p class="letter-line d2">
        세상이 조금 버겁고 마음이 흔들리는 날에도<br>
        변함없이 반겨주는 네가 있어서 나는 다시 웃을 수 있어.
      </p>
      <p class="letter-line d3">
        말보다 깊은 눈빛으로, 그 어떤 위로보다 따뜻한 품으로<br>
        내 모든 계절을 환하게 채워주어 정말 고마워.
      </p>
      <p class="letter-line d4">
        우리가 함께 걷는 모든 날들이<br>
        오늘처럼 포근하고 다정한 빛으로 오래오래 머물기를.
      </p>
      <p class="letter-line d5">
        언제나 네 곁에서 가장 따뜻한 마음으로 사랑할게.
      </p>

      <div class="letter-closing">진심을 담아, 너를 아끼는 마음이</div>

      <button type="button" class="replay-btn" id="replayBtn">편지 다시 읽기</button>
    </article>
  </main>

  <script>
    /* 1. 은은한 하트 & 금빛 입자 애니메이션 */
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    class FloatingItem {
      constructor(initial = false) {
        this.reset(initial);
      }

      reset(initial = false) {
        this.x = Math.random() * width;
        this.y = initial ? Math.random() * height : height + 20 + Math.random() * 60;
        this.isHeart = Math.random() < 0.42; // 42%는 은은한 하트, 나머지는 금빛 먼지 입자
        this.size = this.isHeart ? (7 + Math.random() * 8) : (1.5 + Math.random() * 2.5);
        this.speedY = 0.28 + Math.random() * 0.45;
        this.swayAmp = 12 + Math.random() * 22;
        this.swayFreq = 0.008 + Math.random() * 0.012;
        this.phase = Math.random() * Math.PI * 2;
        this.maxAlpha = this.isHeart ? (0.22 + Math.random() * 0.25) : (0.3 + Math.random() * 0.45);
        this.alpha = 0;
        this.fadeState = 'in';
        this.rotation = (Math.random() - 0.5) * 0.4;
      }

      update() {
        this.y -= this.speedY;
        this.phase += this.swayFreq;
        const currentX = this.x + Math.sin(this.phase) * this.swayAmp;

        if (this.fadeState === 'in') {
          this.alpha += 0.004;
          if (this.alpha >= this.maxAlpha) {
            this.alpha = this.maxAlpha;
            this.fadeState = 'hold';
          }
        }
        if (this.y < height * 0.22) {
          this.alpha -= 0.0035;
        }

        if (this.y < -30 || this.alpha <= 0) {
          this.reset(false);
          return;
        }

        this.draw(currentX, this.y);
      }

      draw(x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(this.rotation + Math.sin(this.phase) * 0.12);
        ctx.globalAlpha = Math.max(0, this.alpha);

        if (this.isHeart) {
          const s = this.size;
          ctx.beginPath();
          ctx.moveTo(0, s * 0.3);
          ctx.bezierCurveTo(-s * 0.5, -s * 0.35, -s, s * 0.1, 0, s);
          ctx.bezierCurveTo(s, s * 0.1, s * 0.5, -s * 0.35, 0, s * 0.3);
          ctx.closePath();

          const grad = ctx.createRadialGradient(0, s * 0.4, 1, 0, s * 0.4, s);
          grad.addColorStop(0, 'rgba(255, 224, 210, 0.95)');
          grad.addColorStop(1, 'rgba(245, 178, 168, 0.35)');
          ctx.fillStyle = grad;
          ctx.shadowColor = 'rgba(255, 205, 185, 0.6)';
          ctx.shadowBlur = 8;
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, this.size, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 238, 195, 0.9)';
          ctx.shadowColor = 'rgba(255, 225, 160, 0.85)';
          ctx.shadowBlur = 10;
          ctx.fill();
        }

        ctx.restore();
      }
    }

    const itemCount = window.innerWidth < 600 ? 24 : 38;
    const particles = Array.from({ length: itemCount }, () => new FloatingItem(true));

    function animateParticles() {
      ctx.clearRect(0, 0, width, height);
      for (const p of particles) {
        p.update();
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* 2. 편지 다시 읽기 애니메이션 리셋 */
    const replayBtn = document.getElementById('replayBtn');
    const letterCard = document.getElementById('letterCard');
    replayBtn.addEventListener('click', () => {
      const animatedEls = letterCard.querySelectorAll('.ornament, .letter-title, .divider, .letter-line, .letter-closing, .replay-btn');
      animatedEls.forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight; // reflow
        el.style.animation = '';
      });
    });

    /* 3. Web Audio API로 생성하는 따뜻하고 잔잔한 오르골/피아노 멜로디 (외부 오디오 파일 불필요) */
    const musicBtn = document.getElementById('musicBtn');
    const musicLabel = document.getElementById('musicLabel');
    let audioCtx = null;
    let isPlaying = false;
    let melodyTimer = null;
    let stepIndex = 0;

    // 따뜻하고 서정적인 F Major 아르페지오 & 멜로디 시퀀스 (Hz)
    const melodySequence = [
      // 마디 1: Fmaj7
      { notes: [174.61, 261.63, 329.63, 440.00], dur: 1.4 },
      { notes: [349.23, 523.25], dur: 0.7 },
      { notes: [440.00], dur: 0.7 },
      { notes: [392.00, 587.33], dur: 1.4 },
      // 마디 2: Em7 -> Am7
      { notes: [164.81, 246.94, 392.00], dur: 1.4 },
      { notes: [329.63, 493.88], dur: 0.7 },
      { notes: [392.00], dur: 0.7 },
      { notes: [220.00, 329.63, 440.00], dur: 1.4 },
      // 마디 3: Dm7
      { notes: [146.83, 220.00, 349.23, 523.25], dur: 1.4 },
      { notes: [493.88], dur: 0.7 },
      { notes: [440.00], dur: 0.7 },
      { notes: [392.00, 329.63], dur: 1.4 },
      // 마디 4: Bbmaj7 -> Csus4 -> C
      { notes: [116.54, 233.08, 349.23, 440.00], dur: 1.4 },
      { notes: [392.00], dur: 0.7 },
      { notes: [349.23], dur: 0.7 },
      { notes: [130.81, 261.63, 329.63, 392.00], dur: 1.8 }
    ];

    function playWarmNote(freq, duration) {
      if (!audioCtx || !isPlaying) return;
      const now = audioCtx.currentTime;

      // 기본 부드러운 사인파 + 따뜻한 배음 트라이앵글파
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(freq, now);

      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(freq * 2, now);

      const subGain = audioCtx.createGain();
      subGain.gain.setValueAtTime(0.08, now); // 배음은 아주 은은하게

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1100, now);

      // 부드러운 어택과 긴 여운
      gainNode.gain.setValueAtTime(0.0001, now);
      gainNode.gain.exponentialRampToValueAtTime(0.075, now + 0.08);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, now + duration + 1.4);

      osc1.connect(filter);
      osc2.connect(subGain);
      subGain.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + duration + 1.5);
      osc2.stop(now + duration + 1.5);
    }

    function scheduleNextStep() {
      if (!isPlaying) return;
      const current = melodySequence[stepIndex % melodySequence.length];
      current.notes.forEach((freq, idx) => {
        setTimeout(() => {
          if (isPlaying) playWarmNote(freq, current.dur);
        }, idx * 75); // 살짝 아르페지오 느낌으로 분산 연주
      });

      stepIndex++;
      melodyTimer = setTimeout(scheduleNextStep, current.dur * 1000);
    }

    function toggleMusic() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      isPlaying = !isPlaying;

      if (isPlaying) {
        musicBtn.classList.add('playing');
        musicBtn.setAttribute('aria-pressed', 'true');
        musicLabel.textContent = '음악 끄기';
        scheduleNextStep();
      } else {
        musicBtn.classList.remove('playing');
        musicBtn.setAttribute('aria-pressed', 'false');
        musicLabel.textContent = '음악 켜기';
        clearTimeout(melodyTimer);
      }
    }

    musicBtn.addEventListener('click', toggleMusic);
  </script>
</body>
</html>
